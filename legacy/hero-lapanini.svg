<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" aria-hidden="true">
  <defs>
    <linearGradient id="steam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- prato -->
  <g transform="translate(1010 300)">
    <ellipse cx="0" cy="360" rx="330" ry="60" fill="#0a0806" opacity=".8"/>
    <ellipse cx="0" cy="40" rx="300" ry="300" fill="#2a1c12"/>
    <ellipse cx="0" cy="40" rx="268" ry="268" fill="#1a110b"/>
    <ellipse cx="0" cy="34" rx="244" ry="244" fill="#241608"/>

    <!-- camadas da lasanha (vista de cima) -->
    <ellipse cx="0" cy="26" rx="226" ry="226" fill="#7a2c14"/>
    <ellipse cx="0" cy="22" rx="200" ry="200" fill="#E85A1F"/>
    <ellipse cx="0" cy="20" rx="168" ry="168" fill="#B83E12"/>
    <ellipse cx="0" cy="16" rx="138" ry="138" fill="#FFB35C"/>
    <ellipse cx="0" cy="14" rx="106" ry="106" fill="#F26B21"/>
    <ellipse cx="0" cy="12" rx="76" ry="76" fill="#FFD58F"/>
    <ellipse cx="0" cy="10" rx="46" ry="46" fill="#E85A1F"/>
    <ellipse cx="0" cy="8" rx="22" ry="22" fill="#9A3A0C"/>

    <!-- queijo derretido -->
    <path d="M-120 40q40-60 120-50q70-20 120 40q30 50-30 70q-90 30-180-10q-60-20-30-50Z" fill="#FFE0A6" opacity=".9"/>

    <!-- vapor -->
    <g fill="none" stroke="url(#steam)" stroke-width="14" stroke-linecap="round">
      <path d="M-60 -90 C-50 -140 -80 -180 -60 -230">
        <animate attributeName="opacity" values="0;.9;0" dur="3.4s" repeatCount="indefinite"/>
      </path>
      <path d="M20 -100 C30 -150 0 -190 20 -240">
        <animate attributeName="opacity" values="0;.7;0" dur="4s" begin=".6s" repeatCount="indefinite"/>
      </path>
      <path d="M90 -80 C100 -130 70 -170 90 -215">
        <animate attributeName="opacity" values="0;.8;0" dur="3.7s" begin="1.1s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- garfo -->
    <g transform="translate(150 -150) rotate(35)" stroke="#d8cfc4" stroke-width="9" stroke-linecap="round" fill="none">
      <path d="M0 0 V170"/>
      <path d="M-16 0V-26M-8 0V-30M0 0V-32M8 0V-30M16 0V-26" stroke-width="7"/>
    </g>
  </g>

  <!-- textura sutil de fundo -->
  <g fill="#f26b21" opacity=".05">
    <circle cx="150" cy="180" r="90"/>
    <circle cx="1480" cy="820" r="120"/>
    <circle cx="1420" cy="120" r="40"/>
  </g>
</svg>
